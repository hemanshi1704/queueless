services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queueless
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: queueless
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueless"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: queueless
      DB_USER: queueless
      DB_PASSWORD: queueless
      APP_JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars

volumes:
  pgdata:
